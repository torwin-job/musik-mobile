description: "musik — Flutter client for self-hosted Go player"
name: musik_app
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  http: ^1.6.0
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  logger: ^2.7.0
  media_kit_libs_linux: ^1.2.1
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/art_placeholder.png
